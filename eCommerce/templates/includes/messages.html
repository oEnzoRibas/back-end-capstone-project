{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<ul class="flashes">
    {% for category, message in messages %}
    {% set css = 'danger' if category == 'error' else category %}
    <li class="alert alert-{{ css }}" role="alert">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}
